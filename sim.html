<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Blotter — copy-trade simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#221E17; --panel:#2A251D; --row:#2C2720; --rowalt:#2E2820;
  --rule:#3E372B; --rule2:#4A4234;
  --ink:#E9E2D2; --muted:#AFA48C; --faint:#8C8270;
  --gain:#7FB88B; --loss:#D96A55; --gold:#C9A356;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ui:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:13px/1.45 var(--ui);min-height:100vh}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)} .flat{color:var(--muted)}

header.strip{position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--rule2);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.stripin{max-width:1780px;margin:0 auto;padding:9px 14px;display:flex;flex-wrap:wrap;
  gap:6px 22px;align-items:baseline}
.mark{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--gold);margin-right:6px}
.mark b{color:var(--ink);font-weight:600}
.stat{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.stat .lb{font:500 9.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.stat .vl{font-family:var(--mono);font-size:14px;font-weight:600}
.stripnav{margin-left:auto;display:flex;gap:3px}
.stripnav a{font:600 10px/1 var(--ui);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;padding:6px 9px;border:1px solid transparent;border-radius:2px}
.stripnav a:hover{color:var(--ink);border-color:var(--rule2)}
.stripnav a.on{color:var(--ground);background:var(--ink)}

.flag{max-width:1780px;margin:0 auto;padding:0 14px}
.flagin{display:flex;gap:11px;align-items:flex-start;margin-top:10px;padding:9px 12px;
  border-left:3px solid var(--loss);background:rgba(217,106,85,.08);font-size:12.5px}
.flagin.ok{border-left-color:var(--gain);background:rgba(127,184,139,.07)}
.flagin .ft{font:600 10px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--loss);white-space:nowrap}
.flagin.ok .ft{color:var(--gain)}
.flagin .fb{color:var(--muted)} .flagin .fb b{color:var(--ink);font-weight:600}

.days{max-width:1780px;margin:12px auto 0;padding:0 14px;display:flex;gap:1px;overflow-x:auto}
.dcell{background:var(--panel);border:1px solid var(--rule);padding:5px 9px;min-width:82px;flex:1 0 auto}
.dcell.now{border-color:var(--gold)}
.dcell .dl{font:500 9px/1.4 var(--mono);letter-spacing:.1em;color:var(--faint)}
.dcell .dv{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:1px}
.dcell .dm{font-size:10px;color:var(--faint)}

.bar{max-width:1780px;margin:14px auto 0;padding:0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:2px}
.tab{background:transparent;border:1px solid var(--rule2);color:var(--muted);border-radius:2px;
  padding:5px 11px;cursor:pointer;font:600 10.5px/1.3 var(--ui);letter-spacing:.09em;text-transform:uppercase}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tab.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tab .c{font-family:var(--mono);opacity:.65;margin-left:5px}
input[type=search]{background:var(--panel);border:1px solid var(--rule2);color:var(--ink);
  padding:6px 10px;border-radius:2px;font:400 12px var(--mono);min-width:190px}
input[type=search]:focus{outline:2px solid var(--gold);outline-offset:-1px}
.hint{color:var(--faint);font-size:11px;margin-left:auto;font-family:var(--mono)}

.sheet{max-width:1780px;margin:10px auto 0;padding:0 14px 18px}
.scroll{overflow:auto;border:1px solid var(--rule);max-height:calc(100vh - 268px)}
/* the body scrolls under a pinned header — position:sticky cannot pin to the viewport
   through an overflow ancestor, so the scroll container IS the viewport here */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;min-width:1320px}
thead th{position:sticky;top:0;z-index:20;background:#241F19;text-align:left;padding:0;
  border-bottom:1px solid var(--rule2)}
thead button{width:100%;background:none;border:0;color:var(--faint);cursor:pointer;text-align:inherit;
  font:600 9.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:8px 9px;
  display:flex;gap:4px;align-items:center}
thead button:hover{color:var(--ink);background:#2B251D}
thead button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
thead th.r button{justify-content:flex-end}
.sortmark{color:var(--gold);font-size:9px;width:7px}
tbody td{padding:5px 9px;border-bottom:1px solid #332D24;white-space:nowrap;vertical-align:top}
tbody tr:nth-child(odd) td{background:var(--row)}
tbody tr:nth-child(even) td{background:var(--rowalt)}
tbody tr:hover td{background:#3A3227}
tbody tr.open-row td{cursor:pointer}
td.r,th.r{text-align:right}
a.coin{font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(201,163,86,.5)}
a.coin:hover{color:var(--gold)}
a.ext{color:var(--gold);text-decoration:none;font-family:var(--mono);font-size:11px;
  border-bottom:1px dotted rgba(201,163,86,.45)}
a.ext:hover{color:var(--ink)}
.tag{display:inline-block;font:600 9px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border:1px solid currentColor;border-radius:2px}
.tag.open{color:var(--gold)} .tag.closed{color:var(--muted)}
.tag.thin{color:var(--loss)} .tag.unsafe{color:var(--loss)} .tag.unpriced{color:var(--faint)}
.why{color:var(--gold);font-size:11px;white-space:normal;max-width:38ch;display:inline-block}
.det td{background:#211D17 !important;padding:10px 14px;white-space:normal}
.det .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 26px}
.det .dk{font:600 9px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.det .dv{font-family:var(--mono);font-size:12px;margin-top:1px}
.det h4{font:600 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);
  margin:12px 0 5px}
.det ol{margin:0;padding-left:20px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.det ol li{margin:2px 0}
.empty{padding:26px 14px;color:var(--faint);font-family:var(--mono);font-size:12px;background:var(--row)}
footer{max-width:1780px;margin:0 auto;padding:0 14px 40px;color:var(--faint);font-size:11px;
  font-family:var(--mono)}
@media(max-width:700px){.stripin{gap:5px 14px}.stat .vl{font-size:12.5px}}
</style>
</head>
<body>

<header class="strip"><div class="stripin">
  <span class="mark">Blotter<b> · copy-trade sim</b></span>
  <span class="stat"><span class="lb">Net</span><span class="vl num" id="s-net">—</span></span>
  <span class="stat"><span class="lb">Return</span><span class="vl num" id="s-roi">—</span></span>
  <span class="stat"><span class="lb">Positions</span><span class="vl num" id="s-n">—</span></span>
  <span class="stat"><span class="lb">Up</span><span class="vl num" id="s-hit">—</span></span>
  <span class="stat"><span class="lb">Deployed</span><span class="vl num" id="s-stake">—</span></span>
  <span class="stat"><span class="lb">Median</span><span class="vl num" id="s-med">—</span></span>
  <span class="stat"><span class="lb">Updated</span><span class="vl num" id="s-upd">—</span></span>
  <nav class="stripnav">
    <a href="./">Radar</a><a class="on" href="./sim.html">Blotter</a><a href="./wallets.html">Wallets</a>
  </nav>
</div></header>

<div class="flag"><div id="flag"></div></div>
<div class="days" id="days"></div>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <input type="search" id="q" placeholder="filter coin, wallet, tx…" aria-label="Filter rows">
  <span class="hint">click any header to sort · click a row for every fill</span>
</div>

<div class="sheet"><div class="scroll">
  <table id="blotter">
    <thead><tr id="hrow"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div></div>

<footer id="foot">—</footer>

<script>
const EXPLORER="https://robinhoodchain.blockscout.com";
const GMGN="https://gmgn.ai/robinhood/token/";

function money(n,dp){ if(n==null||!isFinite(n))return "—";
  return (n<0?"−":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dp??2,maximumFractionDigits:dp??2}); }
function signed(n,dp){ if(n==null||!isFinite(n))return "—";
  return (n>=0?"+":"−")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dp??2,maximumFractionDigits:dp??2}); }
function price(n){ if(n==null||!isFinite(n)||n===0)return "—";
  const a=Math.abs(n);
  if(a>=1000)return money(n,2);
  if(a>=1)return money(n,4);
  return (n<0?"−":"")+"$"+Math.abs(n).toFixed(Math.min(Math.ceil(-Math.log10(a))+3,18)); }
function pct(n,dp){ return (n==null||!isFinite(n))?"—":n.toFixed(dp??2)+"%"; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shortH(h){ return h?esc(h.slice(0,6)+"…"+h.slice(-4)):"—"; }
function ts(t){ if(!t)return "—"; const d=new Date(t); return isNaN(d)?"—":d.toISOString().slice(5,16).replace("T"," "); }
function tsFull(t){ if(!t)return "—"; const d=new Date(t); return isNaN(d)?"—":d.toISOString().slice(0,19).replace("T"," ")+" UTC"; }
function cls(n){ return n>0?"gain":(n<0?"loss":"flat"); }
function tx(h){ return h?`<a class="ext" target="_blank" rel="noopener noreferrer" href="${EXPLORER}/tx/${esc(h)}">${shortH(h)}</a>`:"—"; }
function wal(a){ return a?`<a class="ext" target="_blank" rel="noopener noreferrer" href="${EXPLORER}/address/${esc(a)}">${shortH(a)}</a>`:"—"; }
function coin(sym,token){ const t=esc(sym||"?");
  return token?`<a class="coin" target="_blank" rel="noopener noreferrer" href="${GMGN}${esc(token)}">${t}</a>`:t; }

const COLS=[
  {k:"time",  t:"Opened",  cell:r=>`<span class="num">${ts(r.time)}</span>`},
  {k:"sym",   t:"Coin",    cell:r=>coin(r.sym,r.token)+(r.why?` <span class="why" title="${esc(r.why)}">⚑</span>`:"")},
  {k:"state", t:"State",   cell:r=>`<span class="tag ${r.state}">${r.state}</span>`},
  {k:"size",  t:"Bet",     r:1, cell:r=>r.size==null?"—":`<span class="num">${money(r.size,0)}</span>`},
  {k:"entry", t:"Entry",   r:1, cell:r=>`<span class="num">${price(r.entry)}</span>`},
  {k:"mark",  t:"Now",     r:1, cell:r=>`<span class="num">${price(r.mark)}</span>`},
  {k:"value", t:"Value",   r:1, cell:r=>r.value==null?"—":`<span class="num">${money(r.value)}</span>`},
  {k:"pnl",   t:"P&L",     r:1, cell:r=>r.pnl==null?"—":`<span class="num ${cls(r.pnl)}">${signed(r.pnl)}</span>`},
  {k:"pnlpct",t:"P&L %",   r:1, cell:r=>r.pnlpct==null?"—":`<span class="num ${cls(r.pnlpct)}">${pct(r.pnlpct,1)}</span>`},
  {k:"toll",  t:"Toll",    r:1, cell:r=>r.toll==null?"—":`<span class="num">${pct(r.toll,2)}</span>`},
  {k:"fee",   t:"Fee",     r:1, cell:r=>r.fee==null?"—":`<span class="num">${pct(r.fee*100,2)}</span>`},
  {k:"depth", t:"Pool",    r:1, cell:r=>r.depth==null?"—":`<span class="num">${money(r.depth,0)}</span>`},
  {k:"buys",  t:"Fills",   r:1, cell:r=>r.buys==null?"—":`<span class="num">${r.buys}${r.sells?" / "+r.sells:""}</span>`},
  {k:"closed",t:"Closed",  cell:r=>`<span class="num">${r.closed?ts(r.closed):"—"}</span>`},
  {k:"wallet",t:"Wallet",  cell:r=>wal(r.wallet)},
  {k:"tx",    t:"Tx",      cell:r=>tx(r.tx)},
];

let DATA=null, TAB="all", SORT={k:"time",dir:-1}, Q="", OPENDET=new Set();

function rowsFrom(d){
  const out=[];
  (d.open||[]).forEach(p=>out.push({kind:"open",state:"open",time:p.opened,sym:p.sym,token:p.token,
    size:p.stake,entry:p.entry,mark:p.mark,value:p.liquidation,pnl:p.upnl,
    pnlpct:p.stake?100*p.upnl/p.stake:null,toll:(p.their_push_pct||0)+(p.our_push_pct||0),
    fee:p.fee,depth:p.depth,buys:p.buys,sells:p.sells,closed:null,wallet:p.wallet,
    tx:p.open_tx,fills:p.fills,exits:p.exits,raw:p}));
  (d.closed||[]).forEach(p=>out.push({kind:"closed",state:"closed",time:p.opened,sym:p.sym,token:p.token,
    size:p.stake,entry:p.entry,mark:p.exit_price,value:p.stake+(p.realised||0),pnl:p.realised,
    pnlpct:p.stake?100*p.realised/p.stake:null,toll:(p.their_push_pct||0)+(p.our_push_pct||0),
    fee:p.fee,depth:p.depth,buys:p.buys,sells:p.sells,closed:p.closed_ts,wallet:p.wallet,
    tx:p.open_tx,fills:p.fills,exits:p.exits,raw:p}));
  (d.thin||[]).forEach(r=>out.push({kind:"thin",state:"thin",time:r.ts,sym:r.sym,token:r.token,
    size:null,entry:null,mark:null,value:null,pnl:null,pnlpct:null,toll:null,fee:null,depth:r.depth,
    buys:null,sells:null,closed:null,wallet:r.wallet,tx:r.tx,why:r.why,raw:r}));
  (d.rejected||[]).forEach(r=>out.push({kind:"unsafe",state:"unsafe",time:r.ts,sym:r.sym,token:r.token,
    size:null,entry:null,mark:null,value:null,pnl:null,pnlpct:null,toll:null,fee:null,depth:null,
    buys:null,sells:null,closed:null,wallet:r.wallet,tx:r.tx,why:(r.why||[]).join(" · "),raw:r}));
  (d.unpriceable||[]).forEach(r=>out.push({kind:"unpriced",state:"unpriced",time:r.ts,sym:r.sym,token:r.token,
    size:null,entry:null,mark:null,value:null,pnl:null,pnlpct:null,toll:null,fee:null,depth:null,
    buys:null,sells:null,closed:null,wallet:r.wallet,tx:r.tx,why:r.why,raw:r}));
  return out;
}

const TABS=[
  {k:"all",     t:"All",       f:()=>true},
  {k:"open",    t:"Open",      f:r=>r.kind==="open"},
  {k:"closed",  t:"Closed",    f:r=>r.kind==="closed"},
  {k:"win",     t:"Winners",   f:r=>r.pnl>0},
  {k:"lose",    t:"Losers",    f:r=>r.pnl<0},
  {k:"skipped", t:"Not taken", f:r=>["thin","unsafe","unpriced"].includes(r.kind)},
];

function visible(all){
  const tab=TABS.find(t=>t.k===TAB)||TABS[0];
  let rs=all.filter(tab.f);
  if(Q){ const q=Q.toLowerCase();
    rs=rs.filter(r=>[r.sym,r.wallet,r.tx,r.token].some(v=>String(v||"").toLowerCase().includes(q))); }
  const {k,dir}=SORT;
  rs=rs.slice().sort((a,b)=>{
    let x=a[k],y=b[k];
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;  // blanks always last
    if(typeof x==="string"||typeof y==="string")
      return dir*String(x).localeCompare(String(y),"en",{numeric:true});
    return dir*(x-y);
  });
  return rs;
}

function head(){
  document.getElementById("hrow").innerHTML=COLS.map(c=>{
    const on=SORT.k===c.k, m=on?(SORT.dir===1?"▲":"▼"):"";
    return `<th${c.r?' class="r"':''}><button type="button" data-k="${c.k}"
      aria-label="Sort by ${c.t}" aria-sort="${on?(SORT.dir===1?"ascending":"descending"):"none"}"
      ><span>${c.t}</span><span class="sortmark">${m}</span></button></th>`;}).join("");
  document.querySelectorAll("#hrow button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    SORT = SORT.k===k ? {k,dir:-SORT.dir}
                      : {k,dir:(["sym","state","wallet","tx"].includes(k)?1:-1)};
    render();
  });
}

function detail(r){
  const p=r.raw||{};
  const kv=(k,v)=>`<div><div class="dk">${k}</div><div class="dv">${v}</div></div>`;
  const fills=(r.fills||[]).map(f=>`<li>${ts(f.ts)} — we put in ${money(f.usd)} at ${price(f.px)} ${tx(f.tx)}</li>`).join("");
  const exits=(r.exits||[]).map(f=>`<li>${ts(f.ts)} — wallet sold ${money(f.usd)} at ${price(f.px)} ${tx(f.tx)}</li>`).join("");
  return `<tr class="det"><td colspan="${COLS.length}">
    <div class="dgrid">
      ${kv("Opened",tsFull(r.time))}
      ${kv("Closed",r.closed?tsFull(r.closed):"still open")}
      ${kv("Contract",`<a class="ext" target="_blank" rel="noopener noreferrer" href="${EXPLORER}/token/${esc(r.token||"")}">${esc(r.token||"—")}</a>`)}
      ${kv("Wallet",`<a class="ext" target="_blank" rel="noopener noreferrer" href="${EXPLORER}/address/${esc(r.wallet||"")}">${esc(r.wallet||"—")}</a>`)}
      ${kv("Price they pushed",pct(p.their_push_pct,3))}
      ${kv("Price we pushed",pct(p.our_push_pct,3))}
      ${kv("Pool fee",r.fee==null?"—":pct(r.fee*100,3))}
      ${kv("Money in the pool",money(r.depth,0))}
      ${kv("How it ended",esc(p.exit_reason||"still open"))}
      ${r.why?kv("Why we stayed out",`<span class="why">${esc(r.why)}</span>`):""}
    </div>
    ${fills?`<h4>Our fills</h4><ol>${fills}</ol>`:""}
    ${exits?`<h4>The wallet's exits</h4><ol>${exits}</ol>`:""}
    ${!fills&&!exits?`<div class="dv" style="color:var(--faint);margin-top:8px">no trade was taken on this line</div>`:""}
  </td></tr>`;
}

function render(){
  const d=DATA; if(!d)return;
  const set=(id,html,c)=>{const e=document.getElementById(id);e.innerHTML=html;e.className="vl num "+(c||"");};
  const tot=d.total_pnl_if_closed_now;
  set("s-net",signed(tot),cls(tot));
  set("s-roi",pct(d.roi_if_closed_now),cls(d.roi_if_closed_now));
  set("s-n",String(d.trades_total));
  set("s-hit",pct(d.win_rate_if_closed_now,1),d.win_rate_if_closed_now>50?"gain":"loss");
  set("s-stake",money(d.total_staked,0));
  set("s-med",signed(d.outlier&&d.outlier.median_trade),cls(d.outlier&&d.outlier.median_trade));
  set("s-upd",ts(d.generated));

  const ol=d.outlier||{}, s1=ol.strip&&ol.strip[0]?ol.strip[0].pnl:null;
  document.getElementById("flag").innerHTML = (ol.best_sym==null||s1==null)?"":
    (s1>0
      ? `<div class="flagin ok"><span class="ft">outlier test · pass</span><span class="fb">
         Drop the best trade (<b>${esc(ol.best_sym)}</b>, ${money(ol.best_pnl)}) and the book still holds
         <b>${money(s1)}</b>. It is not resting on one coin.</span></div>`
      : `<div class="flagin"><span class="ft">outlier test · fail</span><span class="fb">
         <b>${esc(ol.best_sym)}</b> alone made ${money(ol.best_pnl)}${ol.best_share_pct!=null?` — <b>${ol.best_share_pct}%</b> of all profit`:""}.
         Drop that one trade and the book is <b>${money(s1)}</b>. The median position is
         <b>${signed(ol.median_trade)}</b>. The headline is one coin, not an edge.</span></div>`);

  const dd=d.days||[];
  document.getElementById("days").innerHTML=dd.map((x,i)=>`<div class="dcell${i===dd.length-1?" now":""}">
    <div class="dl">${esc(x.day.slice(5))}${i===dd.length-1?" · today":""}</div>
    <div class="dv ${cls(x.pnl)}">${signed(x.pnl,0)}</div>
    <div class="dm">${x.wins}/${x.n} up · ${pct(x.roi_pct,1)}</div></div>`).join("");

  const all=rowsFrom(d);
  document.getElementById("tabs").innerHTML=TABS.map(t=>
    `<button type="button" class="tab${t.k===TAB?" on":""}" data-t="${t.k}">${t.t}<span class="c">${all.filter(t.f).length}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();});

  head();
  const rs=visible(all);
  document.getElementById("rows").innerHTML = rs.length
    ? rs.map(r=>{
        const id=`${r.kind}|${r.wallet}|${r.token}|${r.time}`;
        return `<tr class="open-row" data-id="${esc(id)}">`+
          COLS.map(c=>`<td${c.r?' class="r"':''}>${c.cell(r)}</td>`).join("")+`</tr>`+
          (OPENDET.has(id)?detail(r):"");
      }).join("")
    : `<tr><td colspan="${COLS.length}"><div class="empty">nothing matches — clear the filter or pick another tab</div></td></tr>`;
  document.querySelectorAll("tr.open-row").forEach(tr=>tr.onclick=e=>{
    if(e.target.closest("a"))return;
    const id=tr.dataset.id;
    OPENDET.has(id)?OPENDET.delete(id):OPENDET.add(id);
    render();
  });

  const sz=d.sizing||{};
  document.getElementById("foot").textContent =
    `${rs.length} of ${all.length} lines shown · bets sized to ${pct(sz.impact_budget_pct,1)} of our own price impact, `+
    `${money(sz.min_stake,0)} to ${money(sz.max_stake,0)} · rebuilt ${tsFull(d.generated)}`;
}

document.getElementById("q").addEventListener("input",e=>{Q=e.target.value.trim();render();});

async function load(){
  try{
    DATA=await (await fetch("sim_honest.json?t="+Date.now(),{cache:"no-store"})).json();
    render();
  }catch(e){
    document.getElementById("rows").innerHTML=
      `<tr><td colspan="${COLS.length}"><div class="empty">could not load sim_honest.json — ${esc(e.message)}</div></td></tr>`;
  }
}
load(); setInterval(load,60000);
</script>
</body>
</html>
